name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.pull_request.draft == false &&
      startsWith(github.head_ref, 'feature/') &&
      github.base_ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Claude PR review
        # Token/API errors must not block the PR; review is advisory.
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for a native SwiftUI + SwiftData iOS app
            (with a widget and an Apple Watch app). Read CLAUDE.md first — its
            hard rules, seams and invariants are the review checklist.

            Focus on:
            - Correctness: logic bugs, optionals, concurrency (@MainActor,
              Sendable, async/await), retain cycles in closures.
            - SwiftData/CloudKit: no @Attribute(.unique), readers tolerate
              duplicate rows, new @Model types flagged for schema deploy.
            - Seams: analytics only via Track, server writes only via Survey,
              strings only via L.t(...) with all 19 languages in UIStrings.json,
              fonts/colours only via Theme.
            - Privacy: no persistent identifiers minted or sent by app code.
            - UI: Dynamic Type (no fixed text sizes or fixed-height frames),
              SF Symbols for functional icons, green/red only for answer feedback.
            - Generated files (MinnaData.json, KanaChart.json, web/**, audio)
              must not be hand-edited.
            - Tests: missing or weakened coverage for changed behaviour.

            Be concise. Only report real, actionable issues — skip style nits.
            Use inline comments for specific lines, and one top-level summary
            comment via `gh pr comment`. If nothing is wrong, say so briefly.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

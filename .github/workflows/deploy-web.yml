name: Deploy website

# Publishes web/ to Firebase Hosting (target "main") when it changes on main.
# web/ is generated by scripts/build-web.py and committed, so this deploys what
# is in the repo; it does not rebuild it. Scoped to hosting:main on purpose:
# firebase.json also declares the JLPT site and firestore.rules, and an
# unscoped deploy would publish those too.
#
# Needs the repo secret FIREBASE_SERVICE_ACCOUNT: the JSON key of a service
# account on project kf-nihongo with the "Firebase Hosting Admin" role.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Firebase Hosting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Deploy hosting:main
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Repo secret FIREBASE_SERVICE_ACCOUNT is not set"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@14 deploy --only hosting:main --project kf-nihongo --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"

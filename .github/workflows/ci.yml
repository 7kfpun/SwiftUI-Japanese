name: CI

# Every non-draft pull request into main or an integration branch (feature/*), whatever its
# head branch is called. The head used to have to start with feature/, so fix/ PRs skipped
# the Tests and the review without a word (FOX-169). Branch naming is the PR policy's job.
# synchronize is included, so every push to an open PR re-runs.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, "feature/**"]

# Draftness is part of the key. A push and "Ready for review" in the same second give a run
# whose payload still says draft (it skips every job) and the real non-draft run. With one
# key per PR, the stale draft run could cancel the real one and the PR showed CI as skipped.
# Now a run only cancels runs of the same draftness (FOX-38 in SwiftUI-TWAQI).
concurrency:
  group: ci-${{ github.event.pull_request.number }}-draft-${{ github.event.pull_request.draft }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    if: github.event.pull_request.draft == false
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # The level decision's own tests and the skip rules against this checkout. Seconds,
      # before anything is built.
      - name: Check the test-level rules
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools -p 'test_ci_test_level.py'
          python3 tools/ci_test_level.py check

      # skip: nothing more runs and the check is green. test: build and run nihongoTests.
      # tools/ci_test_level.py has the rules; docs/ci-cd-guardrails.md has the table.
      - name: Decide the test level
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Shallow checkout does not contain the base commit, so use the pull request file
          # list. Labels are read live, so re-running the job after adding ci-full-tests
          # picks it up. An empty list or an API error gives the test level: never skip on
          # doubt.
          files="$RUNNER_TEMP/pr-files.txt"
          labels="$RUNNER_TEMP/pr-labels.txt"
          api_error=""
          if ! gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
              --jq '.[].filename' > "$files"; then
            echo "::warning::Could not list the pull request's files. Running the unit tests."
            api_error="--api-error"
          fi
          if ! gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
              --jq '.labels[].name' > "$labels"; then
            echo "::warning::Could not read the pull request's labels. Running the unit tests."
            api_error="--api-error"
          fi
          # shellcheck disable=SC2086 # api_error is empty or one flag
          python3 tools/ci_test_level.py decide --files "$files" --labels "$labels" $api_error

      # Course data, placeholder plists, caches and build-for-testing. Shared with
      # ci-cache.yml, which fills the same keys from main so a PR's first run starts warm.
      - name: Restore caches and build for testing
        if: steps.scope.outputs.level != 'skip'
        uses: ./.github/actions/unit-tests-build
        with:
          minna-deploy-key: ${{ secrets.MINNA_DEPLOY_KEY }}

      # -only-testing:nihongoTests skips nihongoUITests. The jlpt scheme, which hosts
      # jlptUITests, is not invoked.
      - name: Unit tests
        if: steps.scope.outputs.level != 'skip'
        run: |
          set -euo pipefail
          xcodebuild test-without-building \
            -project nihongo.xcodeproj \
            -scheme nihongo \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5' \
            -only-testing:nihongoTests \
            -derivedDataPath "${RUNNER_TEMP}/DerivedData" \
            CODE_SIGNING_ALLOWED=NO

  vulnerabilities:
    name: Vulnerabilities
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # Fails the job when a secret is found. No GITLEAKS_LICENSE: this
      # repository is under the personal account 7kfpun, and the action
      # requires that secret only for organization accounts.
      - name: Secrets scan
        # Advisory: a secret finding should warn, not block the PR.
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      # Scan both lockfiles. Known vulnerabilities warn and are written to one PR
      # comment; they do not fail the check (there is no severity gate). A lockfile
      # the scanner could not read, or that yielded no packages, does fail it, in the
      # step after this one (FOX-169): a scan that sees nothing must not look clean.
      #
      # osv-scanner's JSON lists only packages that have vulnerabilities, so counting
      # `packages` in it gave 0 for a clean lockfile and read as "format unrecognized".
      # The package count is the scanner's own "found N packages" line on stderr.
      - name: Dependency scan
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64"
          sudo install -m 0755 /tmp/osv-scanner /usr/local/bin/osv-scanner
          osv-scanner --version
          mkdir -p /tmp/osv
          rm -f /tmp/osv/unreadable
          : > /tmp/osv/manifest.txt
          scan_lock() {
            file="$1"
            if [ ! -f "$file" ]; then
              echo "::error::lockfile not found: ${file}"
              exit 1
            fi
            out="/tmp/osv/$(printf '%s' "$file" | tr '/' '_').json"
            set +e
            osv-scanner scan source --format json --lockfile "$file" >"$out" 2>"${out}.err"
            code=$?
            set -e
            cat "${out}.err"
            printf '%s %s %s\n' "$code" "$file" "$out" >> /tmp/osv/manifest.txt
          }
          scan_lock Gemfile.lock
          scan_lock nihongo.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          python3 - /tmp/osv/manifest.txt <<'PY'
          import json, os, re, sys
          from pathlib import Path

          rows = []
          errors = []
          notes = []
          unreadable = []
          for line in Path(sys.argv[1]).read_text().splitlines():
              code_s, label, out = line.split(" ", 2)
              code = int(code_s)
              try:
                  data = json.loads(Path(out).read_text() or "{}")
              except Exception as exc:
                  errors.append(f"`{label}`: osv-scanner exit {code}, output was not JSON ({exc}).")
                  unreadable.append(label)
                  continue
              # The scanner's own count of what it parsed (see the step's comment).
              counted = re.findall(r"found (\d+) packages?", Path(out + ".err").read_text(errors="replace"))
              packages = int(counted[-1]) if counted else 0
              found = []
              for result in data.get("results") or []:
                  for pkg in result.get("packages") or []:
                      info = pkg.get("package") or {}
                      name = info.get("name") or "?"
                      version = info.get("version") or "?"
                      for vuln in pkg.get("vulnerabilities") or []:
                          summary = (vuln.get("summary") or "").replace("|", "/").replace("\n", " ").strip()
                          if len(summary) > 160:
                              summary = summary[:157] + "..."
                          found.append((label, name, version, vuln.get("id") or "?", summary))
              notes.append(f"`{label}`: {packages} packages, scanner exit {code}")
              print(notes[-1])
              if packages == 0:
                  # No "found N packages" line, or N is 0: the lockfile was not read.
                  # Fails the check in the next step, loudly.
                  errors.append(f"`{label}`: the scanner read no packages (exit {code}); the lockfile was not scanned.")
                  unreadable.append(label)
              elif code not in (0, 1):
                  errors.append(f"`{label}`: osv-scanner failed with exit {code}.")
              elif code == 1 and not found:
                  errors.append(f"`{label}`: scanner exit 1 with no vulnerability records in the JSON.")
              rows.extend(found)

          def link(vid):
              if vid.startswith("GHSA-"):
                  return f"https://github.com/advisories/{vid}"
              return f"https://osv.dev/vulnerability/{vid}"

          has_findings = bool(rows)
          has_errors = bool(errors)
          lines = ["<!-- ci-vuln-report -->", ""]
          if has_errors:
              lines.append("**Dependency scan failed.**")
          elif has_findings:
              lines.append("**Dependency scan found vulnerabilities.** The check warns and does not fail.")
          else:
              lines.append("**Dependency scan passed.** No known vulnerabilities in the scanned lockfiles.")
          lines.append("")
          seen = set()
          unique = []
          for item in rows:
              key = (item[0], item[1], item[2], item[3])
              if key in seen:
                  continue
              seen.add(key)
              unique.append(item)
          if unique:
              lines += ["| Lockfile | Package | Advisory |", "|---|---|---|"]
              for label, name, version, vid, summary in unique:
                  detail = f" — {summary}" if summary else ""
                  lines.append(f"| `{label}` | `{name}` {version} | [{vid}]({link(vid)}){detail} |")
              lines.append("")
          if errors:
              lines.append("Scan errors:")
              lines.append("")
              lines += [f"- {item}" for item in errors]
              lines.append("")
          for label, name, version, vid, summary in unique:
              detail = f" — {summary}" if summary else ""
              message = f"{name} {version} {vid}{detail}".replace("::", " ")
              print(f"::warning file={label}::{message}")
          for item in errors:
              print(f"::error::{item}")
          lines += [f"- {note}" for note in notes]
          lines += ["", f"[View workflow run]({os.environ['RUN_URL']})", ""]
          body = "\n".join(lines) + "\n"
          Path("/tmp/osv/comment.md").write_text(body)
          Path("/tmp/osv/exitcode").write_text("0\n")  # findings only warn; the next step fails on unreadable
          Path("/tmp/osv/unreadable").write_text("\n".join(unreadable) + "\n") if unreadable else None
          Path("/tmp/osv/done").write_text("1\n")
          Path("/tmp/osv/comment_needed").write_text("1\n" if (has_findings or has_errors) else "0\n")
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path and (has_findings or has_errors):
              visible = "\n".join(line for line in lines if not line.startswith("<!--"))
              with Path(summary_path).open("a") as handle:
                  handle.write(visible.lstrip("\n") + "\n")
          PY
          marker='<!-- ci-vuln-report -->'
          needed=$(tr -d '[:space:]' < /tmp/osv/comment_needed)
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
            --jq "map(select((.body // \"\") | contains(\"${marker}\"))) | .[0].id // empty")
          if [ "$needed" = "1" ] || [ -n "$existing" ]; then
            if [ -n "$existing" ]; then
              jq -n --rawfile body /tmp/osv/comment.md '{body: $body}' \
                | gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" --input -
            else
              gh pr comment "$PR_NUMBER" --body-file /tmp/osv/comment.md
            fi
          fi
          # Warning only — findings already emitted as ::warning / PR comment.
          exit 0

      - name: Fail when a lockfile was not scanned
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f /tmp/osv/done ]; then
            echo "::error::The dependency scan produced no result. Nothing was checked for known vulnerabilities."
            exit 1
          fi
          if [ -f /tmp/osv/unreadable ]; then
            echo "::error::osv-scanner could not read: $(tr '\n' ' ' < /tmp/osv/unreadable). See the dependency scan comment."
            exit 1
          fi
          echo "Every lockfile was read."

# App config, the Android side of config/Secrets.example.plist (iOS: nihongo/Secrets.plist).
# Copy to secrets.properties (gitignored) and fill in the real values; any key left out of
# secrets.properties falls back to this file, so a clean checkout builds as-is.
# Never commit real values.

# AdMob. These are Google's public Android test ids, which serve test ads; the real ones
# come from the AdMob Android app. Slot names follow AdSlot in nihongo/Ads/AdConfig.swift.
ADMOB_APP_ID=ca-app-pub-3940256099942544~3347511713
AD_UNIT_ID_TODAY=ca-app-pub-3940256099942544/9214589741
AD_UNIT_ID_PROGRESS=ca-app-pub-3940256099942544/9214589741
AD_UNIT_ID_KANA=ca-app-pub-3940256099942544/9214589741
AD_UNIT_ID_LESSONS=ca-app-pub-3940256099942544/9214589741
AD_UNIT_ID_SELECT_MODE=ca-app-pub-3940256099942544/9214589741
AD_UNIT_ID_VOCAB_LIST=ca-app-pub-3940256099942544/9214589741
AD_UNIT_ID_SEARCH=ca-app-pub-3940256099942544/9214589741
AD_UNIT_ID_ABOUT=ca-app-pub-3940256099942544/9214589741
AD_UNIT_ID_INTERSTITIAL=ca-app-pub-3940256099942544/1033173712

# Directus (iOS: directusToken in Secrets.plist). The token is a create-only static token on
# japanese_survey_{intro,rating,feedback}. Empty or this placeholder: every survey
# submission is a silent no-op, exactly as in a fresh iOS clone.
DIRECTUS_URL=https://cms.wahthefox.com
DIRECTUS_TOKEN=placeholder-directus-token

# Play upload: path to the Play service-account JSON (gitignored), relative to android/ or
# absolute. Default: play-service-account.json in android/.
PLAY_SERVICE_ACCOUNT_JSON=
